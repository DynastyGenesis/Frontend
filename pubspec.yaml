name: barrel_go
publish_to: 'none'
description: BarelGo client and driver frontend
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  web: ^1.1.1
  path_provider: ^2.1.6
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  flutter_stripe: ^14.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/open_sans_regular.ttf
          weight: 400
        - asset: assets/fonts/open_sans_bold.ttf
          weight: 700
